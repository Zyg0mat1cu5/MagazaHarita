<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mağaza Haritası Paylaşım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root { --bg:#eef4f1; --panel:#fff; --border:#d4dfda; --text:#122820; --muted:#60736a; --accent:#0f8b6d; --accent-soft:#e6f5f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: Manrope, sans-serif; background: linear-gradient(120deg, #edf5f1, #dbe9e2); color: var(--text); -webkit-text-size-adjust:100%; }
    .layout { display:grid; grid-template-columns: 360px 1fr; gap:14px; padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); min-height:100vh; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; overflow:auto; }
    h1 { margin:0; font-size:1.3rem; }
    .sub { color:var(--muted); margin:8px 0 14px; font-size:.92rem; }
    label { display:block; font-weight:700; margin:10px 0 6px; font-size:.9rem; }
    select, input, button { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); font-family:inherit; font-size:16px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    button { border:0; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    button.alt { background:#dce7e1; color:#24453a; }
    .stats { margin-top:12px; padding:10px; border-radius:10px; border:1px solid var(--border); background:#f7fbf9; font-size:.9rem; line-height:1.45; }
    .resultsHead { display:flex; justify-content:space-between; gap:8px; align-items:center; margin:16px 0 10px; }
    .resultsHead strong { font-size:.95rem; }
    .resultsHead span { color:var(--muted); font-size:.82rem; }
    .results { display:grid; gap:10px; max-height:340px; overflow:auto; padding-right:2px; width:100%; min-width:0; }
    .resultCard { width:100%; text-align:left; padding:12px; border:1px solid var(--border); border-radius:14px; background:#fff; color:var(--text); overflow:hidden; display:flex; flex-direction:column; }
    .resultCard:hover { border-color:#8ebaa9; background:var(--accent-soft); }
    .resultCard:focus-visible { outline:2px solid #0f8b6d; outline-offset:2px; }
    .resultTitle { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; margin-bottom:6px; min-width:0; overflow:hidden; }
    .resultTitle strong { display:block; font-size:.92rem; word-break:break-word; overflow-wrap:break-word; flex:1; min-width:0; }
    .badge { flex-shrink:0; padding:4px 8px; border-radius:999px; background:#edf5f1; color:#24453a; font-size:.74rem; font-weight:800; white-space:nowrap; }
    .badge.warn { background:#fff1e8; color:#9b4b1b; }
    .resultMeta { color:var(--muted); font-size:.84rem; margin-top:4px; }
    .emptyState { padding:14px; border:1px dashed var(--border); border-radius:14px; background:#fbfdfc; color:var(--muted); font-size:.9rem; }
    #mapWrap { border-radius:16px; overflow:hidden; border:1px solid var(--border); }
    #map { width:100%; height:100%; min-height:500px; }
    @media (max-width: 920px) {
      .layout { grid-template-columns:1fr; height:auto; }
      .panel { max-height:none; }
      .results { max-height:none; }
      #mapWrap { height:70vh; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <h1>Türkiye Mağaza Haritası</h1>


      <label for="brand">Marka</label>
      <select id="brand"><option value="">Tüm Markalar</option></select>

      <label for="city">İl</label>
      <select id="city"><option value="">Tüm İller</option></select>

      <label for="district">İlçe</label>
      <select id="district"><option value="">Tüm İlçeler</option></select>

      <label for="search">Metin Ara</label>
      <input id="search" placeholder="Marka, mağaza, adres" autocapitalize="off" autocomplete="off" spellcheck="false" />

      <div class="row">
        <button id="btnFilter">Filtrele</button>
        <button id="btnClear" class="alt">Temizle</button>
      </div>

      <div class="stats" id="stats">Yükleniyor...</div>

      <div class="resultsHead">
        <strong>Sonuçlar</strong>
        <span id="resultMeta">Hazırlanıyor...</span>
      </div>
      <div class="results" id="results" aria-live="polite"></div>
    </section>

    <section id="mapWrap"><div id="map"></div></section>
  </main>

    const map = L.map("map").setView([39.0, 35.0], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const clusters = L.markerClusterGroup();
    map.addLayer(clusters);
    const defaultView = { center: [39.0, 35.0], zoom: 6 };
    const markerIndex = new Map();

    const els = {
      brand: document.getElementById("brand"),
      city: document.getElementById("city"),
      district: document.getElementById("district"),
      search: document.getElementById("search"),
      stats: document.getElementById("stats"),
      results: document.getElementById("results"),
      resultMeta: document.getElementById("resultMeta"),
      filter: document.getElementById("btnFilter"),
      clear: document.getElementById("btnClear"),
    };

    const trSort = (a, b) => String(a).localeCompare(String(b), "tr", { sensitivity: "base" });

    function uniq(list) {
      return Array.from(new Set(list));
    }

    function fillSelect(el, items, firstLabel) {
      el.innerHTML = "";
      const first = document.createElement("option");
      first.value = "";
      first.textContent = firstLabel;
      el.appendChild(first);
      items.forEach(v => {
        const op = document.createElement("option");
        op.value = v;
        op.textContent = v;
        el.appendChild(op);
      });
    }

    function setSelectOptions(el, items, firstLabel, preferredValue) {
      fillSelect(el, items, firstLabel);
      el.value = items.includes(preferredValue) ? preferredValue : "";
    }

    function getFilters() {
      return {
        brand: els.brand.value.trim(),
        city: els.city.value.trim(),
        district: els.district.value.trim(),
        search: els.search.value.trim(),
      };
    }

    function filterStores(filters) {
      const brand = filters.brand.toLowerCase();
      const city = filters.city.toLowerCase();
      const district = filters.district.toLowerCase();
      const search = filters.search.toLowerCase();

      return STORE_DATA.filter(s => {
        if (brand && String(s.marka).toLowerCase() !== brand) return false;
        if (city && String(s.il).toLowerCase() !== city) return false;
        if (district && String(s.ilce).toLowerCase() !== district) return false;
        if (search) {
          const blob = `${s.marka} ${s.magaza} ${s.adres} ${s.ilce} ${s.il}`.toLowerCase();
          if (!blob.includes(search)) return false;
        }
        return true;
      });
    }

    function getStoreKey(store) {
      return `${store.marka}__${store.magaza}__${store.adres}`;
    }

    function baseFilter() {
      return filterStores(getFilters());
    }

    function refreshSelects() {
      const filters = getFilters();
      const brands = uniq(filterStores({ city: filters.city, district: filters.district, search: filters.search, brand: "" }).map(s => s.marka)).sort(trSort);
      const cities = uniq(filterStores({ brand: filters.brand, district: filters.district, search: filters.search, city: "" }).map(s => s.il)).sort(trSort);
      const districts = uniq(filterStores({ brand: filters.brand, city: filters.city, search: filters.search, district: "" }).map(s => s.ilce)).sort(trSort);

      setSelectOptions(els.brand, brands, "Tüm Markalar", filters.brand);
      setSelectOptions(els.city, cities, "Tüm İller", filters.city);
      setSelectOptions(els.district, districts, "Tüm İlçeler", filters.district);
    }

    function focusStore(store) {
      const marker = markerIndex.get(getStoreKey(store));
      if (!marker) return;
      map.setView([store.lat, store.lon], 15, { animate: true });
      marker.openPopup();
    }

    function renderResults(filtered, valid) {
      els.results.innerHTML = "";
      els.resultMeta.textContent = filtered.length ? `${filtered.length} kayıt` : "Kayıt yok";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "emptyState";
        empty.textContent = "Seçilen filtrelerle eşleşen mağaza bulunamadı.";
        els.results.appendChild(empty);
        return;
      }

      filtered.forEach(store => {
        const hasCoords = Number.isFinite(store.lat) && Number.isFinite(store.lon);
        const card = document.createElement("button");
        card.type = "button";
        card.className = "resultCard";
        card.innerHTML = `
          <div class="resultTitle">
            <strong>${store.marka}</strong>
            <span class="badge${hasCoords ? "" : " warn"}">${hasCoords ? "Haritada" : "Koordinat yok"}</span>
          </div>
          <div>${store.magaza}</div>
          <div class="resultMeta">${store.ilce} / ${store.il}</div>
          <div class="resultMeta">${store.adres}</div>
        `;

        if (hasCoords) {
          card.addEventListener("click", () => focusStore(store));
        } else {
          card.disabled = true;
        }

        els.results.appendChild(card);
      });
    }

    function draw() {
      const filtered = baseFilter();
      const valid = filtered.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lon));

      clusters.clearLayers();
      markerIndex.clear();
      const bounds = [];
      valid.forEach(s => {
        const m = L.marker([s.lat, s.lon]);
        m.bindPopup(`<strong>${s.marka}</strong><br>${s.magaza}<br>${s.adres}<br>${s.ilce} / ${s.il}`);
        clusters.addLayer(m);
        markerIndex.set(getStoreKey(s), m);
        bounds.push([s.lat, s.lon]);
      });

      if (valid.length === 1) {
        map.setView(bounds[0], 14);
      } else if (valid.length > 1) {
        map.fitBounds(bounds, { padding: [30, 30] });
      } else {
        map.setView(defaultView.center, defaultView.zoom);
      }

      els.stats.textContent = `${filtered.length} kayıt bulundu. Haritada ${valid.length} nokta gösteriliyor. Liste üzerinden bir mağaza seçerek haritaya yaklaşabilirsin.`;
      renderResults(filtered, valid);
    }

    let drawTimer;
    function queueDraw() {
      window.clearTimeout(drawTimer);
      drawTimer = window.setTimeout(() => {
        refreshSelects();
        draw();
      }, 120);
    }

    function init() {
      fillSelect(els.brand, uniq(STORE_DATA.map(s => s.marka)).sort(trSort), "Tüm Markalar");
      fillSelect(els.city, uniq(STORE_DATA.map(s => s.il)).sort(trSort), "Tüm İller");
      refreshSelects();
      draw();
    }

    els.filter.addEventListener("click", () => {
      refreshSelects();
      draw();
    });
    els.clear.addEventListener("click", () => {
      els.brand.value = "";
      els.city.value = "";
      els.district.value = "";
      els.search.value = "";
      refreshSelects();
      draw();
    });
    els.brand.addEventListener("change", queueDraw);
    els.city.addEventListener("change", queueDraw);
    els.district.addEventListener("change", queueDraw);
    els.search.addEventListener("input", queueDraw);
    els.search.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        refreshSelects();
        draw();
      }
    });

    init();
  </script>
